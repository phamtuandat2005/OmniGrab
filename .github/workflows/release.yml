name: CD - Automated Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (patch = bug fixes, minor = new features, major = breaking changes, none = keep current)'
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      engine:
        description: 'Packaging engine (nuitka = C++ compiled machine code, pyinstaller = standard)'
        type: choice
        options:
          - nuitka
          - pyinstaller
        default: nuitka
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cd-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Windows Application (Nuitka C++) & Release
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'

      - name: Bump Version (Semantic Versioning)
        id: bump
        shell: powershell
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != 'none' }}
        env:
          BUMP_KIND: ${{ inputs.bump }}
        run: |
          Write-Host "=== Auto Bump Version: $env:BUMP_KIND ==="
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          $output = python tools/bump_version.py $env:BUMP_KIND --ci --commit
          Write-Host $output
          
          $newVer = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          Write-Host "New version: $newVer"
          echo "new_version=$newVer" >> $env:GITHUB_OUTPUT
          
          git push origin HEAD:main

      - name: Read Current Version
        id: version
        shell: powershell
        run: |
          $ver = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          Write-Host "Building version: $ver"
          echo "app_version=$ver" >> $env:GITHUB_OUTPUT

      - name: Set up MSVC C++ Compiler (for Nuitka C++)
        uses: ilammy/msvc-dev-cmd@v1
        if: ${{ github.event_name == 'push' || inputs.engine == 'nuitka' || inputs.engine == '' }}

      - name: Cache Nuitka Compilation Cache
        uses: actions/cache@v4
        if: ${{ github.event_name == 'push' || inputs.engine == 'nuitka' || inputs.engine == '' }}
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka\Cache
          key: ${{ runner.os }}-nuitka-cache-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-cache-

      - name: Setup FFmpeg and FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        id: setup-ffmpeg

      - name: Install Inno Setup and Ccache
        shell: powershell
        run: |
          Write-Host "=== Installing Inno Setup and Ccache ==="
          choco install innosetup ccache -y --no-progress
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoDir) {
              Add-Content $env:GITHUB_PATH "$innoDir"
              Write-Host "Added Inno Setup to PATH: $innoDir"
          }

      - name: Sync FFmpeg & FFprobe to Repository Root
        shell: powershell
        run: |
          Write-Host "=== Syncing FFmpeg & FFprobe ==="
          $ffmpegPath = (Get-Command ffmpeg -ErrorAction SilentlyContinue).Source
          $ffprobePath = (Get-Command ffprobe -ErrorAction SilentlyContinue).Source
          if ($ffmpegPath) {
              Copy-Item $ffmpegPath -Destination .\ffmpeg.exe -Force
              Write-Host "FFmpeg copied: .\ffmpeg.exe"
          }
          if ($ffprobePath) {
              Copy-Item $ffprobePath -Destination .\ffprobe.exe -Force
              Write-Host "FFprobe copied: .\ffprobe.exe"
          }

      - name: Install Python Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller nuitka zstandard

      - name: Prepare Playwright Browsers
        shell: powershell
        run: |
          python -m playwright install chromium

      - name: Execute Build Release Pipeline
        shell: powershell
        env:
          INPUT_ENGINE: ${{ inputs.engine }}
        run: |
          $engine = if ($env:INPUT_ENGINE -and $env:INPUT_ENGINE -ne "") { $env:INPUT_ENGINE } else { "nuitka" }
          Write-Host "=== Starting OmniGrab Packaging with $engine ==="
          python build_release.py --$engine

      - name: Verify Release Artifacts
        shell: powershell
        run: |
          Write-Host "=== Verifying Artifact Integrity ==="
          $installer = Get-ChildItem -Path dist_installer -Filter "OmniGrab.Setup.*.exe"
          $portable  = Get-ChildItem -Path dist_installer -Filter "OmniGrab_*_Portable.zip"
          
          if (-not $installer) {
              Write-Error "Installer OmniGrab.Setup.*.exe not found in dist_installer!"
              exit 1
          }
          if (-not $portable) {
              Write-Error "Portable archive OmniGrab_*_Portable.zip not found in dist_installer!"
              exit 1
          }
          Write-Host "Installer : $($installer.FullName)"
          Write-Host "Portable  : $($portable.FullName)"

      - name: Generate SHA-256 Checksums
        shell: powershell
        run: |
          Write-Host "=== Generating SHA256 Checksums ==="
          $files = Get-ChildItem -Path dist_installer -File | Where-Object { $_.Name -like "*.exe" -or $_.Name -like "*.zip" }
          $checksumLines = @()
          foreach ($file in $files) {
              $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash
              $line = "$hash  $($file.Name)"
              $checksumLines += $line
              Write-Host $line
          }
          $checksumLines | Out-File -FilePath dist_installer\SHA256SUMS.txt -Encoding utf8
          
          $sumFile = Get-Item dist_installer\SHA256SUMS.txt
          if ($sumFile.Length -eq 0) {
              Write-Error "SHA256SUMS.txt is empty! No binaries were hashed."
              exit 1
          }
          Write-Host "SHA256SUMS.txt created successfully: $($sumFile.Length) bytes"

      - name: Upload Workflow Artifacts (Internal Storage)
        uses: actions/upload-artifact@v4
        with:
          name: OmniGrab-Dist-Installer
          path: dist_installer/*
          retention-days: 30

      - name: Create & Push Version Tag
        shell: powershell
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bump != 'none' }}
        run: |
          $ver = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $tag = "v$ver"
          Write-Host "Tagging release: $tag"
          git tag -f $tag
          git push origin $tag --force

      - name: Extract Release Info
        id: release_info
        shell: powershell
        run: |
          $appVer = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF -like "refs/tags/*") {
              $tagName = $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
              $tagName = "v$appVer"
          }
          echo "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          echo "app_version=$appVer" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: OmniGrab ${{ steps.release_info.outputs.tag_name }} - Official Release (Nuitka C++)
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist_installer/OmniGrab.Setup.*.exe
            dist_installer/OmniGrab_*_Portable.zip
            dist_installer/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
