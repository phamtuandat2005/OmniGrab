name: CD - Automated Release & Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      engine:
        description: 'Công cụ đóng gói (nuitka = C++ mã máy bảo mật cao, pyinstaller = script)'
        type: choice
        options:
          - nuitka
          - pyinstaller
        default: nuitka
      draft:
        description: 'Tạo bản phát hành nháp (Draft release)'
        type: boolean
        default: false
      prerelease:
        description: 'Đánh dấu là bản phát hành thử nghiệm (Pre-release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cd-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Windows Application (Nuitka C++) & Release
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'

      - name: Set up MSVC C++ Compiler (for Nuitka C++)
        uses: ilammy/msvc-dev-cmd@v1
        if: ${{ github.event_name == 'push' || inputs.engine == 'nuitka' || inputs.engine == '' }}

      - name: Cache Nuitka Compilation Cache
        uses: actions/cache@v4
        if: ${{ github.event_name == 'push' || inputs.engine == 'nuitka' || inputs.engine == '' }}
        with:
          path: |
            ~\AppData\Local\Nuitka\Nuitka\Cache
          key: ${{ runner.os }}-nuitka-cache-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-cache-

      - name: Setup FFmpeg and FFprobe
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        id: setup-ffmpeg

      - name: Install Inno Setup
        shell: powershell
        run: |
          Write-Host "=== Cài đặt Inno Setup qua Chocolatey ==="
          choco install innosetup -y --no-progress
          $innoDir = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoDir) {
              Add-Content $env:GITHUB_PATH "$innoDir"
              Write-Host "Đã thêm Inno Setup vào PATH: $innoDir"
          }

      - name: Sync FFmpeg & FFprobe to Repository Root
        shell: powershell
        run: |
          $ffmpegCmd = (Get-Command ffmpeg).Source
          $ffprobeCmd = (Get-Command ffprobe).Source
          Copy-Item $ffmpegCmd -Destination .\ffmpeg.exe -Force
          Copy-Item $ffprobeCmd -Destination .\ffprobe.exe -Force
          Write-Host "Đã đồng bộ FFmpeg: .\ffmpeg.exe ($((Get-Item .\ffmpeg.exe).Length) bytes)"
          Write-Host "Đã đồng bộ FFprobe: .\ffprobe.exe ($((Get-Item .\ffprobe.exe).Length) bytes)"

      - name: Install Python Dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller nuitka zstandard

      - name: Prepare Playwright Browsers
        shell: powershell
        run: |
          python -m playwright install chromium

      - name: Execute Build Release Pipeline
        shell: powershell
        env:
          INPUT_ENGINE: ${{ inputs.engine }}
        run: |
          $engine = if ($env:INPUT_ENGINE -and $env:INPUT_ENGINE -ne "") { $env:INPUT_ENGINE } else { "nuitka" }
          Write-Host "=== Bắt đầu đóng gói OmniGrab bằng công nghệ $engine ==="
          python build_release.py --$engine

      - name: Verify Release Artifacts
        shell: powershell
        run: |
          Write-Host "=== Kiểm tra tính toàn vẹn các file đầu ra ==="
          $installer = Get-ChildItem -Path dist_installer -Filter "OmniGrab.Setup.*.exe"
          $portable  = Get-ChildItem -Path dist_installer -Filter "OmniGrab_*_Portable.zip"
          
          if (-not $installer) {
              Write-Error "Không tìm thấy bộ cài đặt OmniGrab.Setup.*.exe trong dist_installer!"
              exit 1
          }
          if (-not $portable) {
              Write-Error "Không tìm thấy file nén OmniGrab_*_Portable.zip trong dist_installer!"
              exit 1
          }
          Write-Host "Installer : $($installer.FullName) ($([math]::Round($installer.Length / 1MB, 2)) MB)"
          Write-Host "Portable  : $($portable.FullName) ($([math]::Round($portable.Length / 1MB, 2)) MB)"

      - name: Generate SHA-256 Checksums
        shell: powershell
        run: |
          Write-Host "=== Tính mã băm bảo mật SHA256 ==="
          Set-Location dist_installer
          $checksumLines = @()
          Get-ChildItem -File -Include "*.exe", "*.zip" | ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
              $line = "$hash  $($_.Name)"
              $checksumLines += $line
              Write-Host $line
          }
          $checksumLines | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Set-Location ..

      - name: Upload Workflow Artifacts (Internal Storage)
        uses: actions/upload-artifact@v4
        with:
          name: OmniGrab-Dist-Installer
          path: dist_installer/*
          retention-days: 30

      - name: Extract Tag or Release Title
        id: release_info
        shell: powershell
        run: |
          $appVer = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF -like "refs/tags/*") {
              $tagName = $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
              $tagName = "v$appVer"
          }
          echo "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          echo "app_version=$appVer" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: OmniGrab ${{ steps.release_info.outputs.tag_name }} - Official Release (Nuitka C++)
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            dist_installer/OmniGrab.Setup.*.exe
            dist_installer/OmniGrab_*_Portable.zip
            dist_installer/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

